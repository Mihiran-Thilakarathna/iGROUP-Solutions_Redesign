    <meta name="description" content="iGroup Solutions is an emerging leader in software development industry. We solve business challenges with latest technology." />
    <meta name="keywords" content="software development, mobile development, IT companies, software companies, ecommerce solutions, staff augmentation, Sri Lanka" />
    <meta name="theme-color" content="#050505" />
    <meta property="og:title" content="iGroup Solutions | We Build Your Digital Future" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- pick the theme and paint its background before the bundle loads, so there's no flash on entry -->
    <script>
      (function () {
        var t = 'dark';
        try { if (localStorage.getItem('igs-theme') === 'light') t = 'light'; } catch (e) {}
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.scrollbar = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ece3d4');
      })();
    </script>
    <style>html, body { background: #050505; } html[data-theme='light'], html[data-theme='light'] body { background: #ece3d4; }</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet" />
